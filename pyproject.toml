[project]
name = "api-template"
version = "0.1.0"
requires-python = ">=3.12.0,<3.13.0"
dependencies = [
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.8.0",
    "dacite>=1.8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client", "src/ws"]
